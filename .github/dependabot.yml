# Automated dependency updates. Monthly, grouped to minimize PR noise.
# Action updates bump the version tag in the workflow and the commit SHA in
# .github/workflows/actions.lock together. No secrets required.
version: 2
updates:
  # Python dependencies managed by uv (reads pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns:
          - "*"

  # GitHub Actions used in workflows (keeps actions.lock current).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
