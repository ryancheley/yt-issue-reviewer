name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deny-all by default; each job opts into the least privilege it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Format check (ruff)
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Type check (ty)
        run: uv run --python ${{ matrix.python-version }} ty check

      - name: Tests (pytest)
        run: uv run --python ${{ matrix.python-version }} pytest

  # Aggregate gate: a single stable "check" status context for branch protection,
  # green only when every `test` matrix leg (3.11-3.14) succeeds. This keeps the
  # required check name fixed as the matrix dimensions change over time.
  check:
    runs-on: ubuntu-latest
    permissions: {}
    needs: test
    if: always()
    steps:
      - name: Verify all matrix jobs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more test matrix jobs failed: ${{ needs.test.result }}"
            exit 1
          fi

  # Static-analysis security audit of the workflow files themselves.
  # Runs via uvx (no project dependency, no extra runtime). --offline needs no token.
  # Threshold is medium (persona: regular) and can be tightened later; the gating step
  # must NOT use --format sarif (SARIF always exits 0 even with findings).
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Audit workflows (zizmor)
        run: >-
          uvx zizmor@1.26.1
          --offline
          --persona regular
          --min-severity medium
          --format github
          .github/workflows/
