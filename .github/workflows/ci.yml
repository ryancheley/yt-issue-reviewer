name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deny-all by default; each job opts into the least privilege it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Format check (ruff)
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Type check (ty)
        run: uv run --python ${{ matrix.python-version }} ty check

      - name: Tests (pytest)
        run: uv run --python ${{ matrix.python-version }} pytest

  # Aggregate gate: a single stable "check" status context for branch protection,
  # green only when every `test` matrix leg (3.11-3.14) succeeds. This keeps the
  # required check name fixed as the matrix dimensions change over time.
  check:
    runs-on: ubuntu-latest
    permissions: {}
    needs: test
    if: always()
    steps:
      - name: Verify all matrix jobs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more test matrix jobs failed: ${{ needs.test.result }}"
            exit 1
          fi

  # Static-analysis security audit of the workflow files themselves.
  # Runs via uvx (no project dependency, no extra runtime). --offline needs no token.
  # Threshold is medium (persona: regular) and can be tightened later; the gating step
  # must NOT use --format sarif (SARIF always exits 0 even with findings).
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Audit workflows (zizmor)
        run: >-
          uvx zizmor@1.32.0
          --offline
          --persona regular
          --min-severity medium
          --format github
          .github/workflows/

  # Fails when .github/workflows/actions.lock is out of sync with the
  # workflows or a locked pin no longer verifies upstream.
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify actions lockfile
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
